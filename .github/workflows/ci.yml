name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser tests exercise the IndexedDB implementation, not the Node
      # version, so run them once rather than on every matrix entry.
      - name: Install browsers
        if: matrix.node-version == 24
        run: pnpm browsers --only-shell

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:node

      - name: Test (browser)
        if: matrix.node-version == 24
        run: pnpm test:browser
